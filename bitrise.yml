---
format_version: '8'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: other
trigger_map:
# push_branch is intentionally scoped to master only, not "*". With both
# push_branch: "*" and pull_request_source_branch: "*", pushing to a branch
# that already has an open PR fired two builds for the same commit (one from
# each webhook event). Branches without an open PR now get no CI at all
# until a PR exists; master itself still gets a post-merge sanity build.
# pull_request_source_branch stays "*" (not narrowed) because this repo
# accepts external PRs from forks, and a fork's pushes never fire a
# push_branch event against this repo -- pull_request is the only trigger
# that can see them.
# https://discuss.bitrise.io/t/build-on-the-same-commit-sha-triggered-twice/4413
- push_branch: master
  workflow: primary
- pull_request_source_branch: "*"
  workflow: primary
workflows:
  primary:
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - script@1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            xcodebuild -version
        title: Echo xcodebuild version
    - git-clone@8.5:
        inputs:
        - submodule_update_depth: '1'
    - script@1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # make pipelines' return status equal the last command to exit with a non-zero status, or zero if all commands exit successfully
            set -o pipefail
            # debug log
            set -x

            brew update
        title: brew update
    - brew-install@1.0:
        inputs:
        - packages: autoconf automake pkg-config gnutls texinfo python@3.13 xz
    - script@1:
        title: build.sh
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            bash build.sh emacs30
    - script@1:
        title: 'Smoke test: launch built Emacs'
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            # Catches a broken build early: `make bootstrap`/`make install`
            # can succeed while the resulting binary still fails to start
            # (dyld errors, missing resources, etc). Running it here, on the
            # same machine that built it, only proves the build itself is
            # sound -- it does NOT reproduce the Gatekeeper "is damaged"
            # dialog users see after downloading pkg.tar.xz from a browser,
            # since that's about the quarantine attribute + code signature
            # on the *downloaded* copy, not the binary's own correctness.
            bin="pkg/Applications/Emacs/Emacs.app/Contents/MacOS/Emacs"
            test -x "$bin"

            # NOTE: --eval reads only the first top-level form from the
            # string, so everything must be wrapped in one (progn ...).
            "$bin" --batch --eval "
            (progn
              (unless (string-prefix-p \"30.2\" emacs-version)
                (error \"unexpected emacs-version: %s\" emacs-version))
              (unless (fboundp 'mac-ime-toggle)
                (error \"mac-ime-toggle not bound -- did the ns-inline-patch apply?\"))
              (princ (format \"smoke test OK: %s\n\" emacs-version)))
            "
    - script@1:
        title: Codesign Emacs.app (ad-hoc)
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            # Emacs's own build only ad-hoc-signs individual Mach-O
            # binaries (required just to execute at all on Apple Silicon);
            # the app bundle itself is never sealed as a whole (no
            # Contents/_CodeSignature/CodeResources, Info.plist not
            # bound -- verified with `codesign -dvvv`: Sealed Resources
            # was "none"). Under quarantine (e.g. after downloading from
            # the Bitrise Artifacts tab), Gatekeeper treats that as an
            # invalid signature and shows an unrecoverable "Emacs is
            # damaged and can't be opened" dialog with no way to override
            # it. Neither this build nor the release workflow has a
            # Developer ID / notarization set up, but a free,
            # no-certificate deep ad-hoc sign still seals the bundle
            # properly, which downgrades the failure to the ordinary
            # "unidentified developer" prompt a user can allow via
            # System Settings > Privacy & Security. Confirmed locally
            # that this turns "Sealed Resources: none" into a populated
            # resource seal and lets the app launch after `xattr -cr`.
            codesign --force --deep --sign - pkg/Applications/Emacs/Emacs.app
    - script@1:
        title: Package nightly build
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            # Nightly/daily artifacts used to go to Azure Blob Storage, but
            # that step (`az login -u/-p`) started failing with AADSTS50079:
            # Azure AD now enforces MFA on username/password sign-in and
            # this repo has no other use for Azure. Switched to Bitrise's
            # own artifact storage instead: standard build artifacts are
            # retained for 90 days on every plan, including free/Hobby
            # (https://discuss.bitrise.io/t/advanced-warning-new-build-artifact-retention-periods-coming-on-31-march-2026/25747),
            # which is plenty for short-lived nightly builds and needs no
            # cloud account at all. Anything copied into $BITRISE_DEPLOY_DIR
            # is picked up by the deploy-to-bitrise-io step below.
            mkdir -p "$BITRISE_DEPLOY_DIR"
            tar cJvf pkg.tar.xz pkg/Applications/Emacs
            cp pkg.tar.xz "$BITRISE_DEPLOY_DIR/emacs-30.2_$(date -u +%Y%m%d_%H%M%S_UTC).tar.xz"
    - deploy-to-bitrise-io@2: {}
    - slack@4:
        inputs:
        - webhook_url: "$slack_webhook_url"
    meta:
      bitrise.io:
        stack: osx-xcode-16.4.x
  release:
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - script@1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            xcodebuild -version
        title: Echo xcodebuild version
    - git-clone@4: {}
    - script@1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # make pipelines' return status equal the last command to exit with a non-zero status, or zero if all commands exit successfully
            set -o pipefail
            # debug log
            set -x

            brew update
        title: brew update
    - brew-install@0:
        inputs:
        - packages: autoconf automake pkg-config gnutls texinfo python xz gh
    - script@1:
        title: Build Emacs.app
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            bash build.sh emacs30
    - script@1:
        title: 'Smoke test: launch built Emacs'
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            # See the same step in the primary workflow for why this exists
            # and what it does/doesn't prove.
            bin="pkg/Applications/Emacs/Emacs.app/Contents/MacOS/Emacs"
            test -x "$bin"

            # NOTE: --eval reads only the first top-level form from the
            # string, so everything must be wrapped in one (progn ...).
            "$bin" --batch --eval "
            (progn
              (unless (string-prefix-p \"30.2\" emacs-version)
                (error \"unexpected emacs-version: %s\" emacs-version))
              (unless (fboundp 'mac-ime-toggle)
                (error \"mac-ime-toggle not bound -- did the ns-inline-patch apply?\"))
              (princ (format \"smoke test OK: %s\n\" emacs-version)))
            "
    - script@1:
        title: Codesign Emacs.app (ad-hoc)
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            # This used to call `build.sh codesign` with a Developer ID
            # Application identity, but that certificate is expired
            # (2025-04-29) and the Apple Developer Program membership
            # needed to issue a new one has lapsed and won't be renewed for
            # now. Signing attempts failed with "error: The specified item
            # could not be found in the keychain." (no cert was ever
            # imported either -- see PR #17, superseded by this change).
            # Falls back to the same free, no-certificate deep ad-hoc sign
            # used by the primary/nightly workflow. See that step's
            # comment for why this is still worth doing over no signature
            # at all.
            codesign --force --deep --sign - pkg/Applications/Emacs/Emacs.app
    - script@1:
        title: Deploy to GitHub Releases
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            # Release artifacts used to go to Azure Blob Storage, but that
            # step (`az login -u/-p`) started failing with AADSTS50079:
            # Azure AD now enforces MFA on username/password sign-in and
            # this repo has no other use for Azure -- keeping a whole cloud
            # account alive for one upload step wasn't worth it. Switched to
            # GitHub Releases: per-file cap is 2 GiB, no limit on total
            # release size or bandwidth, no extra cost on a public repo
            # (https://docs.github.com/en/repositories/releasing-projects-on-github/about-releases).
            # Requires the build to be triggered from a git tag
            # (BITRISE_GIT_TAG) and a `github_token` secret (PAT with
            # repo / Contents:write scope) set in this app's Secrets.
            : "${BITRISE_GIT_TAG:?release workflow must be triggered from a git tag}"
            export GH_TOKEN="$github_token"

            # `gh release upload local-path#label` only sets a cosmetic
            # display label -- the asset's real name (and download URL)
            # stays the local file's basename. Rename before uploading so
            # the actual downloaded file is named sensibly.
            asset="emacs-${BITRISE_GIT_TAG}-macos.tar.xz"
            tar cJvf "$asset" pkg/Applications/Emacs

            if ! gh release view "$BITRISE_GIT_TAG" --repo hiroakit/emacs-on-apple >/dev/null 2>&1; then
                gh release create "$BITRISE_GIT_TAG" \
                    --repo hiroakit/emacs-on-apple \
                    --title "$BITRISE_GIT_TAG" \
                    --notes "Automated macOS build of Emacs ${BITRISE_GIT_TAG}."
            fi

            gh release upload "$BITRISE_GIT_TAG" \
                "$asset" \
                --repo hiroakit/emacs-on-apple \
                --clobber
    - slack@3:
        inputs:
        - webhook_url: "$slack_webhook_url"
meta:
  bitrise.io:
    stack: osx-xcode-16.4.x
    machine_type_id: g2.mac.medium
